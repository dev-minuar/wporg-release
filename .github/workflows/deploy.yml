name: Deploy to WordPress.org

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to deploy (defaults to the git tag without a leading v)'
        type: string
        required: false
        default: ''
      slug:
        description: 'WordPress.org plugin slug (defaults to the repository name)'
        type: string
        required: false
        default: ''
      dry-run:
        description: 'Run every step except the SVN commit'
        type: boolean
        required: false
        default: false
      plugin-check:
        description: 'Run Plugin Check on the distributable files'
        type: boolean
        required: false
        default: true
    secrets:
      SVN_USERNAME:
        required: false
      SVN_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: wporg-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # No secrets in this job. It runs third-party code (Plugin Check, wp-env, npm).
  checks:
    runs-on: ubuntu-latest
    # Plugin Check 20 + other steps (checkout, lint, validator, build) 15 margin
    timeout-minutes: 35
    outputs:
      version: ${{ steps.meta.outputs.version }}
      slug: ${{ steps.meta.outputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version and slug
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          slug="$INPUT_SLUG"
          if [ -z "$slug" ]; then
            slug="${GITHUB_REPOSITORY#*/}"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Invalid version '$version'. Allowed characters: letters, digits, dot, plus, hyphen."
            exit 1
          fi
          if ! [[ "$slug" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid slug '$slug'. Allowed characters: lowercase letters, digits, hyphen."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Deploying $slug $version (dry run: $DRY_RUN)"

      - name: Require .distignore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .distignore ]; then
            echo "::error::No .distignore in the repository root. Without it 10up builds the package from .gitattributes and Plugin Check would check different files than ship. Add a .distignore."
            exit 1
          fi

      - name: Check version numbers match
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          main_file="$(grep -l -E '^[[:space:]/*#]*Plugin Name:' ./*.php | head -n 1 || true)"
          if [ -z "$main_file" ]; then
            echo "::error::No PHP file with a 'Plugin Name:' header in the repository root."
            exit 1
          fi
          header="$(grep -m 1 -E '^[[:space:]/*#]*Version:' "$main_file" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r[:space:]' || true)"
          stable="$(grep -m 1 -i -E '^Stable tag:' readme.txt | sed -E 's/^[Ss]table [Tt]ag:[[:space:]]*//' | tr -d '\r[:space:]' || true)"
          if [ -z "$header" ]; then
            echo "::error::No 'Version:' header found in $main_file."
            exit 1
          fi
          if [ -z "$stable" ]; then
            echo "::error::No 'Stable tag:' line found in readme.txt."
            exit 1
          fi
          echo "Tag: $version | $main_file Version: $header | readme Stable tag: $stable"
          if [ "$version" != "$header" ] || [ "$version" != "$stable" ]; then
            echo "::error::Version mismatch: tag $version, plugin header $header, readme Stable tag $stable."
            exit 1
          fi

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './.git/*' -print0 \
            | xargs -0 -n 1 php -l > /tmp/php-lint.log || { cat /tmp/php-lint.log; exit 1; }
          echo "$(grep -c 'No syntax errors' /tmp/php-lint.log) PHP files pass php -l"

      - name: WordPress.org readme validator
        shell: bash
        run: |
          set -euo pipefail
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/readme.txt"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$raw")" != "200" ]; then
            echo "::warning::readme.txt is not publicly reachable (private repository?); skipping the online validator."
            exit 0
          fi
          enc="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$raw")"
          curl -fsS --retry 3 "https://wordpress.org/plugins/developers/readme-validator/?readme=${enc}" -o /tmp/validator.html
          python3 - <<'PY'
          import html, re, sys
          page = open('/tmp/validator.html', encoding='utf-8').read()
          start = page.find('Readme Validator</h1>')
          end = page.find('or paste your', start)
          text = html.unescape(re.sub(r'<[^>]+>', '\n', page[start:end] if start >= 0 else ''))
          lines = [l.strip() for l in text.splitlines() if l.strip()]
          print('\n'.join(lines))
          bad = [l for l in lines if l.startswith('Fatal') or l.startswith('Warnings')]
          if start < 0:
              print('::warning::Validator page format not recognised; result not checked.')
          elif bad:
              print('::error::The readme validator reported: ' + ', '.join(bad))
              sys.exit(1)
          PY

      - name: Build distributable copy
        if: ${{ inputs.plugin-check }}
        shell: bash
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          rsync -a --exclude-from=.distignore --exclude=.git ./ "/tmp/dist/$SLUG/"
          rm -rf "./.wporg-dist" && mv /tmp/dist "./.wporg-dist"

      - name: Plugin Check
        if: ${{ inputs.plugin-check }}
        timeout-minutes: 20
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: './.wporg-dist/${{ steps.meta.outputs.slug }}'
          ignore-warnings: 'true'

      - name: Remove distributable copy
        if: ${{ always() && inputs.plugin-check }}
        shell: bash
        run: |
          rm -rf ./.wporg-dist
          # Plugin Check writes .wp-env.json into the workspace root.
          if git ls-files --error-unmatch .wp-env.json >/dev/null 2>&1; then
            git checkout -- .wp-env.json
          else
            rm -f .wp-env.json
          fi

  # Fresh runner. The SVN secrets exist only in the 10up step's env below.
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # svn install 5 + deploy 20 + wait 30 = 55, plus 10 margin
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install svn
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          command -v svn >/dev/null 2>&1 || sudo apt-get install -y -o Acquire::Retries=3 subversion

      - name: Deploy to WordPress.org
        timeout-minutes: 20
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ inputs.dry-run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ needs.checks.outputs.slug }}
          VERSION: ${{ needs.checks.outputs.version }}

      - name: Wait until WordPress.org serves the new version
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          SLUG: ${{ needs.checks.outputs.slug }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          set -euo pipefail
          slug="$SLUG"; version="$VERSION"
          for _ in $(seq 1 60); do
            live="$(curl -s "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=${slug}&nocache=${RANDOM}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || true)"
            if [ "$live" = "$version" ]; then
              echo "WordPress.org now serves $slug $version: https://wordpress.org/plugins/$slug/"
              exit 0
            fi
            sleep 30
          done
          echo "::error::WordPress.org still serves '$live' after 30 minutes."
          exit 1
